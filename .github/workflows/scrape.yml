name: Collect notices

on:
  schedule:
    - cron: "0 11 * * *" # every day at 08:00 in Fortaleza (UTC-3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Collect notices
        run: |
          set -o pipefail
          uv run main.py --json out.json | tee notices.txt

      - name: Write job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat notices.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notices
          path: |
            out.json
            notices.txt

      - name: Commit updated out.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add out.json
          git diff --cached --quiet || (git commit -m "Update out.json" && git push)
