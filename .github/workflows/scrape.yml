name: Collect notices

on:
  schedule:
    - cron: "0 11 * * *" # every day at 08:00 in Fortaleza (UTC-3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Collect notices
        run: |
          set -o pipefail
          # Print the output to the log and to the job summary, inside a code block
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          uv run main.py --database notices.db --export-json notices.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notices
          path: |
            notices.db
            notices.json

      - name: Commit updated notices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add notices.db notices.json
          git diff --cached --quiet || (git commit -m "Update notices" && git push)
